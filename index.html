<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Школьный ИИ-Ассистент</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #chat-container { width: 500px; height: 650px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
        #chat-header { background: #4a69bd; color: white; padding: 15px 20px; font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        #chat-header span { font-size: 12px; background: #78e08f; color: #1e3d59; padding: 2px 8px; border-radius: 10px; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f7f9fc; }
        .msg { padding: 12px 16px; border-radius: 16px; max-width: 80%; word-wrap: break-word; line-height: 1.5; font-size: 15px; }
        .user { background: #4a69bd; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .loading { font-style: italic; color: #7f8c8d; background: transparent; box-shadow: none; }
        #input-area { display: flex; border-top: 1px solid #e1e8ed; padding: 15px; background: #fff; }
        input { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-size: 14px; transition: 0.2s; }
        input:focus { border-color: #4a69bd; }
        button { background: #4a69bd; color: white; border: none; padding: 0 22px; margin-left: 10px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #3c569b; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">
        🎓 Школьный Ментор Версия 2.0
        <span>Онлайн</span>
    </div>
    <div id="messages">
        <div class="msg bot">Привет! Я твой персональный школьный ИИ-наставник. Какой предмет разберем сегодня? 😉</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Задайте вопрос по урокам..." onkeypress="if(event.key === 'Enter') send()">
        <button onclick="send()">Спросить</button>
    </div>
</div>

<script>
    // ⚠️ ЗАМЕНИТЕ НА ВАШУ ССЫЛКУ ИЗ LOCAL TUNNEL
    const AI_URL = 'https://bmrbx-37-215-15-77.run.pinggy-free.link/v1/chat/completions'; 

    const messagesContainer = document.getElementById('messages');
    const userInput = document.getElementById('user-input');

    function appendMessage(text, side, isRaw = false) {
        const div = document.createElement('div');
        div.className = `msg ${side}`;
        if (isRaw) {
            div.innerHTML = text; // Для красивых переносов строк
        } else {
            div.innerText = text;
        }
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function send() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        userInput.value = '';

        appendMessage('Учитель думает...', 'bot loading');
        const loadingMsg = messagesContainer.lastChild;

        try {
            const response = await fetch(AI_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Bypass-Tunnel-Reminder': 'true'
                },
                body: JSON.stringify({
                    model: "local-model", 
                    messages: [{ role: 'user', content: text }],
                    stream: false
                })
            });

            const data = await response.json();
            loadingMsg.remove(); 
            
            // Превращаем обычные переносы строк \n в HTML-теги <br>, чтобы текст не слипался
            let botResponse = data.choices[0].message.content;
            botResponse = botResponse.replace(/\n/g, '<br>');
            
            appendMessage(botResponse, 'bot', true);
        } catch (error) {
            loadingMsg.remove();
            appendMessage('Ошибка: Школа закрыта (ПК выключен или сервер не запущен).', 'bot');
            console.error(error);
        }
    }
</script>
</body>
</html>
